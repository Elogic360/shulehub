name: ShuleConnect CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: shuleconnect_test_db
          POSTGRES_USER: shuleconnect_user
          POSTGRES_PASSWORD: shuleconnectPASS
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run backend tests
      env:
        DATABASE_URL: postgresql+psycopg://shuleconnect_user:shuleconnectPASS@localhost:5432/shuleconnect_test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-ci-secret-key-for-running-automated-checks
        ENVIRONMENT: test
      run: |
        cd backend
        pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Install frontend dependencies
      run: |
        cd frontend
        pnpm install

    - name: Build frontend
      run: |
        cd frontend
        pnpm build
